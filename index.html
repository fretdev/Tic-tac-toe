
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#081c15">
    <title>Tic-Tac-Toe | FretDev</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <script src="index.js" defer></script>
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <p class="eyebrow">THE CLASSIC GAME</p>
            <h1 class="game-title">Tic-Tac-Toe<span>.</span></h1>
            <p class="game-subtitle">A little strategy goes a long way.</p>
        </header>

        <section class="game-panel" aria-label="Tic-Tac-Toe game">
            <div class="game-info">
                <p class="game-status" aria-live="polite">Start a new game to play.</p>
            </div>

            <div class="game-board" role="group" aria-label="Game board"></div>

            <div class="game-controls">
                <button class="btn btn-primary new-game-btn" type="button">
                    New game
                </button>
                <button class="btn btn-secondary reset-game-btn" type="button">
                    Restart
                </button>
            </div>
        </section>

        <footer class="game-footer">
            <span>Think ahead. Play smart.</span>
        </footer>
    </main>

    <dialog class="modal" aria-labelledby="modalTitle">
        <form class="modal-contents" method="dialog" onsubmit="return false">
            <div class="modal-header">
                <p class="eyebrow">LET'S PLAY</p>
                <h2 class="modal-title" id="modalTitle">Game setup</h2>
                <p class="modal-description">Choose your opponent and get ready to play.</p>
            </div>

            <div class="setup-fields">
                <label class="setup-field" for="gameMode">
                    <span>Game mode</span>
                    <select id="gameMode">
                        <option value="ai">Play against AI</option>
                        <option value="human">Two players</option>
                    </select>
                </label>

                <label class="setup-field" for="player1">
                    <span>Your name</span>
                    <input
                        type="text"
                        id="player1"
                        placeholder="Enter your name"
                        maxlength="30"
                        autocomplete="given-name"
                        required
                    >
                    <small>You will play as X.</small>
                </label>

                <div id="player2Field" hidden>
                    <label class="setup-field" for="player2">
                        <span>Player 2 name</span>
                        <input
                            type="text"
                            id="player2"
                            placeholder="Enter player 2's name"
                            maxlength="30"
                            autocomplete="off"
                        >
                        <small>Player 2 will play as O.</small>
                    </label>
                </div>

                <div id="aiDifficultyField">
                    <label class="setup-field" for="difficulty">
                        <span>AI difficulty</span>
                        <select id="difficulty">
                            <option value="easy">Easy — Random moves</option>
                            <option value="medium" selected>Medium — Tactical moves</option>
                            <option value="hard">Hard — Minimax</option>
                        </select>
                    </label>
                    <p class="field-hint">
                        Hard mode looks ahead to choose its best move.
                    </p>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary close-modal" type="button">
                    Cancel
                </button>
                <button class="btn btn-primary start-game" type="button">
                    Start game
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
